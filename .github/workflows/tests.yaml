name: Tests

# The unit tests of the workflow scripts and the bookmarklet (node --test, no dependencies)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Follow the latest long-term support release.
          node-version: 'lts/*'
          check-latest: true
      - run: node --test "tests/*.test.js"
