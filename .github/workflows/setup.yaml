name: Setup

# Sets up the labels, the project board, and the variables from config.yaml, writes the settings
# into the form (and the workflow times), and makes the bookmark (in the summary of the run).
# Actions > Setup > Run workflow. Safe to run again: it changes only what is not set yet.
# The fields show the values of config.yaml (the setup writes them there): change a field to change
# that setting. bash scripts/setup.sh runs this workflow too.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only show what would change"
        type: boolean
        default: false
      project_title:
        description: "Name of the project board"
        default: "Job Applications"
      city:
        description: "Default City in the form, for example Berlin, DE"
        default: "Stockholm, SE"
      timezone:
        description: "Time zone, for example Europe/Berlin"
        default: "Europe/Stockholm"
      reminder_time:
        description: "Daily follow-up reminders, local time (HH:MM)"
        default: "09:23"
      summary_day:
        description: "Weekly summary day"
        type: choice
        options: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
        default: "Monday"
      summary_time:
        description: "Weekly summary, local time (HH:MM)"
        default: "08:17"
      follow_up_days:
        description: "Days without news before a follow-up reminder"
        default: "10"
      ghosted_days:
        description: "Days without an answer before the ghosted label"
        default: "30"
      salary_placeholder:
        description: "Example in the Salary range field, for example 60k-80k EUR/year"
        default: "70000-110000 SEK/month"

permissions:
  issues: write
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          CURRENT_PERIOD: ${{ vars.CURRENT_PERIOD }}
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/setup.js`)({ github, context, core, getOctokit });
